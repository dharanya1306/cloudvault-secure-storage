# ===================================================================
# CloudVault - Production-Grade Application Configuration Properties
# ===================================================================

# Application Info
spring.application.name=cloudvault-backend
server.port=8080
server.servlet.context-path=/

# ===================================================================
# 1. DATABASE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloudvault_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# 2. MULTIPART FILE UPLOAD LIMITS (50MB)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB

# ===================================================================
# 3. AWS S3 CONFIGURATION (AWS SDK for Java v2)
# ===================================================================
cloudvault.aws.access-key=${AWS_ACCESS_KEY_ID:AKIAIOSFODNN7EXAMPLE}
cloudvault.aws.secret-key=${AWS_SECRET_ACCESS_KEY:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
cloudvault.aws.region=${AWS_REGION:us-east-1}
cloudvault.aws.s3.bucket-name=${S3_BUCKET_NAME:cloudvault-secure-storage-prod}
cloudvault.aws.s3.endpoint-override=${S3_ENDPOINT_OVERRIDE:}

# ===================================================================
# 4. CRYPTOGRAPHY CONFIGURATION (AES/GCM/NoPadding 256-Bit)
# Base64 encoded 256-bit (32 bytes) master encryption key
# ===================================================================
cloudvault.security.aes.secret-key=${AES_SECRET_KEY:uN8kL3zQ7wR5vT9yB2xM4cE6gH8jK1mP3sV5xZ8aC0d=}

# ===================================================================
# 5. JJWT 0.12.5 CONFIGURATION
# Base64 encoded HMAC-SHA256 secret key (at least 256 bits)
# ===================================================================
cloudvault.security.jwt.secret=${JWT_SECRET:c2VjdXJlLWNsb3VkdmF1bHQtaGlnaGx5LWNvbmZpZGVudGlhbC1qd3Qtc2VjcmV0LWtleS0yMDI2LXZhbGlk}
# Expiration: 24 Hours in Milliseconds (86,400,000 ms)
cloudvault.security.jwt.expiration-ms=86400000

# ===================================================================
# 6. STORAGE QUOTA & AUDIT SETTINGS
# Default quota per user: 1GB (1,073,741,824 bytes)
# ===================================================================
cloudvault.storage.default-quota-bytes=1073741824

# CORS Allowed Origins
cloudvault.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ais-dev-3ag52znhlc5htjrnjbcufq-193002059748.asia-northeast1.run.app}

# Logging configuration
logging.level.root=INFO
logging.level.com.cloudvault=DEBUG
logging.level.org.springframework.security=INFO
